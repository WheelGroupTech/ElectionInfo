# Election Explorer: build the engine, its console tests and the window prototype on Linux and
# macOS, and run the tests and the window's --selftest.
#
# Windows is built locally with Applications.sln: it needs the VS 18 (v145) toolset, which
# GitHub's hosted Windows runners do not have yet.
#
# The macOS job runs on Apple Silicon (macos-14), so it tests the arm64 half of the universal
# build; the developers' Intel Mac tests the x86_64 half.
name: Election Explorer

on:
  push:
    paths:
      - "Applications/ElectionExplorer/**"
      - ".github/workflows/election-explorer.yml"
  pull_request:
    paths:
      - "Applications/ElectionExplorer/**"
      - ".github/workflows/election-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Ubuntu 24.04, Tesseract)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Applications/ElectionExplorer
    env:
      OMP_THREAD_LIMIT: "1" # Tesseract's threads (see test/README.md)
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools, Tesseract and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng fonts-liberation
      - name: Configure
        run: cmake --preset linux-x64-release
      - name: Build
        run: cmake --build --preset linux-x64-release
      - name: Smoke suite
        run: ctest --preset linux-x64-release
      - name: Window self-test (no display)
        run: ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest test/sample_voters.csv
      - name: Window self-test, duplicates, reports, options, saved filters and links (made-up lists)
        run: |
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest test/sample_duplicates.csv | tee selftest.txt
          grep -q "Showing 4 duplicate Voter IDs of 9 voters" selftest.txt
          grep -q "Showing 4 duplicate voters (name + DOB) of 9 voters" selftest.txt
          grep -q "Precinct report: 5 unique precincts" selftest.txt
          grep -q "Address report: 7 unique addresses" selftest.txt
          grep -qF "names with a comma: 2 of 2; given name first: 0 (new view 0); surname first again: 2 (new view 0)" selftest.txt
          grep -qF "sorted by Name: given name first (new view 1), surname first (new view 1)" selftest.txt
          grep -qF "copy of 2 rows: 256 bytes normalized, 128 without" selftest.txt
          grep -qF "Open Street Maps: https://www.openstreetmap.org/search?query=100%20Main%20St%2C%20Austin%20TX" selftest.txt
          grep -qF "filter file CSV (.filter.csv): saved 1, loaded 1, 2 rules, the same 1" selftest.txt
          grep -qF "filter file TSV (.filter.tsv): saved 1, loaded 1, 2 rules, the same 1" selftest.txt
          grep -qF "Rule 2 (No Such Column is \"1\"): this window has no column of that name." selftest.txt
          grep -qF "filter file without rules: 0, The file holds no filter rules." selftest.txt
          grep -qF "link 1: HTTPS://example.org/a?b=1&c=2" selftest.txt
          grep -qF "link 2: https://example.org/x_" selftest.txt
          grep -qF "link in the Address column: (none)" selftest.txt
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest test/sample_links.csv > links.txt
          grep -qF "shown cells with a link: 4" links.txt
      - name: Roster window self-test (made-up rosters)
        run: |
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-roster test/sample_roster.csv test/sample_roster_mail.csv > roster.txt
          cat roster.txt
          grep -qF "roster 1: rows 11, columns 6" roster.txt
          grep -qF "column 3: \"Voting Method\"" roster.txt
          grep -qF "status: 11 voter records" roster.txt
          grep -qF "filter Voting Method is \"Mail Ballot\": Filtered: 3 of 11 voter records" roster.txt
          grep -qF "copy: 2 rows, 2 lines, 14 separators" roster.txt
          grep -qF "export names: \"sample_roster-Filtered_Roster.csv\", \"sample_roster-Selected_Roster.csv\", \"sample_roster-Roster.csv\"" roster.txt
          grep -qF "roster filter file: loaded 1, 1 rule on column 3" roster.txt
          grep -qF "Showing 2 duplicate Voter IDs of 11 voter records" roster.txt
          grep -qF "Precinct report: 3 unique precincts" roster.txt
          grep -qF "voting totals: 8 rows, 7 columns" roster.txt
          grep -qF "totals row 7 (bold): Total | 3 | 4 | 2 | 1 | not available | 10 |" roster.txt
          grep -qF "totals status: 10 voters, each counted once (1 later record of 1 Voter ID not counted)" roster.txt
          grep -qF "totals export: 8 rows, BOM 1" roster.txt
          grep -qF "load summary (notable 1):" roster.txt
      - name: Duplicate voters voting self-test (made-up list and roster)
        run: |
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-voting test/sample_duplicates.csv test/sample_roster_voting.csv > voting.txt
          cat voting.txt
          grep -qF "voting without a roster: Load a voter roster (File > Open Voter Roster" voting.txt
          grep -qF "voting: 2 marked" voting.txt
          grep -qF "voting status: Showing 2 duplicate voters (name + DOB) voting in sample_roster_voting.csv of 9 voters" voting.txt
          grep -qF "voting sorted: sorted by column 0, ascending 0; 2 of 9 rows shown; Voter IDs 300002 300001" voting.txt
          grep -qF "voting filtered: duplicate voters (name + DOB) voting in sample_roster_voting.csv within filter: 1 of 9 voters" voting.txt
          grep -qF "voting reset: 9 voters" voting.txt
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-voting test/sample_duplicates.csv test/sample_roster.csv > none.txt
          grep -qF "voting: No voters with the same name and date of birth voted under different Voter IDs in sample_roster.csv." none.txt
      - name: Compare and Show Differences self-test (made-up lists and rosters)
        run: |
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-compare list test/sample_voters.csv list test/sample_voters_later.csv > compare.txt
          cat compare.txt
          grep -qF "compare window: \"Compare - sample_voters.csv vs sample_voters_later.csv\"" compare.txt
          grep -qF "compare row 0: Only here | 1 | 1" compare.txt
          grep -qF "compare row 1: Voter ID repeated | 0 | 1" compare.txt
          grep -qF "compare row 6: Precinct changed | 1 | 1" compare.txt
          grep -qF "show row 0 in B: Showing 1 voters only here vs sample_voters.csv of 6 voters" compare.txt
          grep -qF "show row 1 in A: No voters in that category." compare.txt
          grep -qF "summary export: Identical,1,1" compare.txt
          grep -qF "records export: 11 rows, BOM 1" compare.txt
          grep -qF "differences window: \"Differences - sample_voters.csv vs sample_voters_later.csv\", 5 rows" compare.txt
          grep -qF "differences sorted by 1, ascending 0: [100004 | Precinct | 203 | 204]" compare.txt
          grep -qF "differences export: 5 rows, BOM 1" compare.txt
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-compare roster test/sample_roster.csv roster test/sample_roster_mail.csv > compare_rosters.txt
          grep -qF "compare row 5: Voting Method changed | 1 | 1" compare_rosters.txt
          grep -qF "compare row 6: Date Voted changed | 1 | 1" compare_rosters.txt
          grep -qF "differences sorted by -1, ascending 1: [1000000105 | Voting Method | Election Day In-Person | Mail Ballot]" compare_rosters.txt
          ../Build/linux-x64-release/ElectionExplorer/election-explorer --selftest-compare roster test/sample_roster_voting.csv list test/sample_duplicates.csv > compare_mixed.txt
          grep -qF "compare menu in A: Compare with sample_duplicates.csv (voter list)" compare_mixed.txt
          grep -qF "compare row 5: Identical | 6 | 6" compare_mixed.txt
          grep -qF "differences: No differing voters found." compare_mixed.txt

  macos:
    name: macOS (Apple Silicon, Apple Vision)
    runs-on: macos-14
    defaults:
      run:
        working-directory: Applications/ElectionExplorer
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset mac-universal-release
      - name: Build
        run: cmake --build --preset mac-universal-release
      - name: Architectures
        run: lipo -info ../Build/mac-universal-release/ElectionExplorer/smoke_load
      - name: Smoke suite
        run: ctest --preset mac-universal-release
      - name: Window self-test (no display)
        run: '"../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest test/sample_voters.csv'
      - name: Window self-test, duplicates, reports, options, saved filters and links (made-up lists)
        run: |
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest test/sample_duplicates.csv | tee selftest.txt
          grep -q "Showing 4 duplicate Voter IDs of 9 voters" selftest.txt
          grep -q "Showing 4 duplicate voters (name + DOB) of 9 voters" selftest.txt
          grep -q "Precinct report: 5 unique precincts" selftest.txt
          grep -q "Address report: 7 unique addresses" selftest.txt
          grep -qF "names with a comma: 2 of 2; given name first: 0 (new view 0); surname first again: 2 (new view 0)" selftest.txt
          grep -qF "sorted by Name: given name first (new view 1), surname first (new view 1)" selftest.txt
          grep -qF "copy of 2 rows: 256 bytes normalized, 128 without" selftest.txt
          grep -qF "Open Street Maps: https://www.openstreetmap.org/search?query=100%20Main%20St%2C%20Austin%20TX" selftest.txt
          grep -qF "filter file CSV (.filter.csv): saved 1, loaded 1, 2 rules, the same 1" selftest.txt
          grep -qF "filter file TSV (.filter.tsv): saved 1, loaded 1, 2 rules, the same 1" selftest.txt
          grep -qF "Rule 2 (No Such Column is \"1\"): this window has no column of that name." selftest.txt
          grep -qF "filter file without rules: 0, The file holds no filter rules." selftest.txt
          grep -qF "link 1: HTTPS://example.org/a?b=1&c=2" selftest.txt
          grep -qF "link 2: https://example.org/x_" selftest.txt
          grep -qF "link in the Address column: (none)" selftest.txt
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest test/sample_links.csv > links.txt
          grep -qF "shown cells with a link: 4" links.txt
      - name: Roster window self-test (made-up rosters)
        run: |
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-roster test/sample_roster.csv test/sample_roster_mail.csv > roster.txt
          cat roster.txt
          grep -qF "roster 1: rows 11, columns 6" roster.txt
          grep -qF "column 3: \"Voting Method\"" roster.txt
          grep -qF "status: 11 voter records" roster.txt
          grep -qF "filter Voting Method is \"Mail Ballot\": Filtered: 3 of 11 voter records" roster.txt
          grep -qF "copy: 2 rows, 2 lines, 14 separators" roster.txt
          grep -qF "export names: \"sample_roster-Filtered_Roster.csv\", \"sample_roster-Selected_Roster.csv\", \"sample_roster-Roster.csv\"" roster.txt
          grep -qF "roster filter file: loaded 1, 1 rule on column 3" roster.txt
          grep -qF "Showing 2 duplicate Voter IDs of 11 voter records" roster.txt
          grep -qF "Precinct report: 3 unique precincts" roster.txt
          grep -qF "voting totals: 8 rows, 7 columns" roster.txt
          grep -qF "totals row 7 (bold): Total | 3 | 4 | 2 | 1 | not available | 10 |" roster.txt
          grep -qF "totals status: 10 voters, each counted once (1 later record of 1 Voter ID not counted)" roster.txt
          grep -qF "totals export: 8 rows, BOM 1" roster.txt
          grep -qF "load summary (notable 1):" roster.txt
      - name: Duplicate voters voting self-test (made-up list and roster)
        run: |
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-voting test/sample_duplicates.csv test/sample_roster_voting.csv > voting.txt
          cat voting.txt
          grep -qF "voting without a roster: Load a voter roster (File > Open Voter Roster" voting.txt
          grep -qF "voting: 2 marked" voting.txt
          grep -qF "voting status: Showing 2 duplicate voters (name + DOB) voting in sample_roster_voting.csv of 9 voters" voting.txt
          grep -qF "voting sorted: sorted by column 0, ascending 0; 2 of 9 rows shown; Voter IDs 300002 300001" voting.txt
          grep -qF "voting filtered: duplicate voters (name + DOB) voting in sample_roster_voting.csv within filter: 1 of 9 voters" voting.txt
          grep -qF "voting reset: 9 voters" voting.txt
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-voting test/sample_duplicates.csv test/sample_roster.csv > none.txt
          grep -qF "voting: No voters with the same name and date of birth voted under different Voter IDs in sample_roster.csv." none.txt
      - name: Compare and Show Differences self-test (made-up lists and rosters)
        run: |
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-compare list test/sample_voters.csv list test/sample_voters_later.csv > compare.txt
          cat compare.txt
          grep -qF "compare window: \"Compare - sample_voters.csv vs sample_voters_later.csv\"" compare.txt
          grep -qF "compare row 0: Only here | 1 | 1" compare.txt
          grep -qF "compare row 1: Voter ID repeated | 0 | 1" compare.txt
          grep -qF "compare row 6: Precinct changed | 1 | 1" compare.txt
          grep -qF "show row 0 in B: Showing 1 voters only here vs sample_voters.csv of 6 voters" compare.txt
          grep -qF "show row 1 in A: No voters in that category." compare.txt
          grep -qF "summary export: Identical,1,1" compare.txt
          grep -qF "records export: 11 rows, BOM 1" compare.txt
          grep -qF "differences window: \"Differences - sample_voters.csv vs sample_voters_later.csv\", 5 rows" compare.txt
          grep -qF "differences sorted by 1, ascending 0: [100004 | Precinct | 203 | 204]" compare.txt
          grep -qF "differences export: 5 rows, BOM 1" compare.txt
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-compare roster test/sample_roster.csv roster test/sample_roster_mail.csv > compare_rosters.txt
          grep -qF "compare row 5: Voting Method changed | 1 | 1" compare_rosters.txt
          grep -qF "compare row 6: Date Voted changed | 1 | 1" compare_rosters.txt
          grep -qF "differences sorted by -1, ascending 1: [1000000105 | Voting Method | Election Day In-Person | Mail Ballot]" compare_rosters.txt
          "../Build/mac-universal-release/ElectionExplorer/Election Explorer.app/Contents/MacOS/Election Explorer" --selftest-compare roster test/sample_roster_voting.csv list test/sample_duplicates.csv > compare_mixed.txt
          grep -qF "compare menu in A: Compare with sample_duplicates.csv (voter list)" compare_mixed.txt
